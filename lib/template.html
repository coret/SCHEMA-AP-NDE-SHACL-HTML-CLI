    if (i < 0) return el('span', { class: 'none' }, '');
    var c = DICT.component[i];
    return el('span', { title: c.iri || c.label }, compLabel(i));
  }
  function shapeNode(i) {
    if (i < 0) return el('span', { class: 'none' }, '');
    var s = DICT.shape[i];
    if (s.name) return el('span', { title: s.name + ' (' + s.id + ')' }, s.name); // full name in the tooltip: the cell is clipped
    return s.id.lastIndexOf('_:', 0) === 0 ? el('span', { class: 'mono' }, s.label) : iriNode(s.id, s.label);
  }
  function msgNode(i) {
    var text = msgText(i);
    return text ? el('span', null, text) : el('span', { class: 'none' }, '(no message)');
  }

  // ---- state ---------------------------------------------------------------

  var st = { sev: [], msg: null, path: null, comp: null, q: '', sort: null, dir: 1, page: 1, size: 50, lang: DEFAULT_LANG };
  var FACETS = [
    { key: 'msg', col: M, select: 'f-msg', all: 'All messages', none: '(no message)', label: msgText, size: DICT.message.length },
    { key: 'path', col: P, select: 'f-path', all: 'All paths', none: '(no path)', label: pathLabel, size: DICT.path.length },
    { key: 'comp', col: C, select: 'f-comp', all: 'All constraints', none: '(no constraint)', label: compLabel, size: DICT.component.length }
  ];
  var COLS = [
    { key: 'sev', title: 'Severity', sortKey: function (r) { return sevRank(r[S]); }, cls: 'nowrap', node: function (r) { return sevBadge(r[S]); } },
    { key: 'focus', title: 'Focus node', sortKey: function (r) { return termText(r[F]); }, cls: 'iri', node: function (r) { return termNode(r[F]); } },
    { key: 'path', title: 'Path', sortKey: function (r) { return pathLabel(r[P]); }, node: function (r) { return pathNode(r[P]); } },
    { key: 'value', title: 'Value', sortKey: function (r) { return termText(r[V]); }, used: function (r) { return r[V] != null; }, node: function (r) { return termNode(r[V]); } },
    { key: 'msg', title: 'Message', sortKey: function (r) { return msgText(r[M]); }, cls: 'msg', node: function (r) { return msgNode(r[M]); } },
    { key: 'comp', title: 'Constraint', cls: 'nowrap', sortKey: function (r) { return compLabel(r[C]); }, used: function (r) { return r[C] >= 0; }, node: function (r) { return compNode(r[C]); } },
    { key: 'shape', title: 'Shape', cls: 'clip', sortKey: function (r) { return shapeLabel(r[H]); }, used: function (r) { return r[H] >= 0; }, node: function (r) { return shapeNode(r[H]); } }
  ].filter(function (c) { return !c.used || R.some(c.used); }); // drop columns that are empty in this report

  var view = [];        // indexes into R after filtering and sorting
  var matched = 0;      // exact number of results that match the filters (can exceed view.length)
  var counts = null;    // facet counts given the other active filters
  var hay = null;       // lower-cased search haystack per row, built on first search
  var expanded = {};    // row index -> true

  function inRange(n, size) { return n === -1 || (n >= 0 && n < size); }

  function readHash() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ''));
    var int = function (k) { var v = p.get(k); return v !== null && /^-?\d+$/.test(v) ? parseInt(v, 10) : null; };
    st.sev = (p.get('sev') || '').split(',').filter(function (v) { return /^\d+$/.test(v); }).map(Number)
      .filter(function (v) { return v < DICT.severity.length; });
    FACETS.forEach(function (f) { var v = int(f.key); st[f.key] = v !== null && inRange(v, f.size) ? v : null; });
    st.q = p.get('q') || '';
    var sort = p.get('sort');
    st.sort = COLS.some(function (c) { return c.key === sort; }) ? sort : null;
    st.dir = p.get('dir') === 'desc' ? -1 : 1;
    st.page = Math.max(1, int('page') || 1);
    st.size = SIZES.indexOf(int('size')) >= 0 ? int('size') : 50;
    st.lang = LANGS.indexOf(p.get('lang')) >= 0 ? p.get('lang') : DEFAULT_LANG;
  }

  function hashString() {
    var p = new URLSearchParams();
    if (st.sev.length) p.set('sev', st.sev.join(','));
    FACETS.forEach(function (f) { if (st[f.key] !== null) p.set(f.key, st[f.key]); });
    if (st.q) p.set('q', st.q);
    if (st.sort) { p.set('sort', st.sort); if (st.dir < 0) p.set('dir', 'desc'); }
    if (st.page > 1) p.set('page', st.page);
    if (st.size !== 50) p.set('size', st.size);
    if (st.lang !== DEFAULT_LANG) p.set('lang', st.lang);
    return p.toString();
  }

  function writeHash() {
    var h = hashString();
    if (h === location.hash.replace(/^#/, '')) return;
    try {
      history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
    } catch (e) {
      location.hash = h;
    }
  }

  // ---- filtering and sorting ------------------------------------------------

  function buildHay() {
    hay = R.map(function (r) {
      var focus = termText(r[F]);
      return (focus + ' ' + (typeof r[F] === 'string' ? curie(focus) : '') + ' ' + termText(r[V])).toLowerCase();
    });
  }

  function compute() {
    var q = st.q.trim().toLowerCase();
    if (q && !hay) buildHay();
    var sevSet = st.sev.length ? st.sev : null;
    counts = { sev: {}, msg: {}, path: {}, comp: {} };
    var inc = function (o, k) { o[k] = (o[k] || 0) + 1; };
    view = [];
    for (var i = 0; i < R.length; i++) {
      var r = R[i];
      if (q && hay[i].indexOf(q) < 0) continue;
      var fs = sevSet !== null && sevSet.indexOf(r[S]) < 0;
      var fm = st.msg !== null && r[M] !== st.msg;
      var fp = st.path !== null && r[P] !== st.path;
      var fc = st.comp !== null && r[C] !== st.comp;
      var fails = fs + fm + fp + fc;
      if (fails > 1) continue;
      // A facet value is counted when the row passes every *other* filter.
      if (fails === 0 || fs) inc(counts.sev, r[S]);
      if (fails === 0 || fm) inc(counts.msg, r[M]);
      if (fails === 0 || fp) inc(counts.path, r[P]);
      if (fails === 0 || fc) inc(counts.comp, r[C]);
      if (fails === 0) view.push(i);
    }
    matched = view.length;
    if (!q) {
      // Without a text search the counts come from the exact totals per error, so they are
      // right even when the list was shortened. (A search can only look at listed results.)
      counts = { sev: {}, msg: {}, path: {}, comp: {} };
      matched = 0;
      var add = function (o, k, n) { o[k] = (o[k] || 0) + n; };
      GROUPS.forEach(function (g) {
        var gs = sevSet !== null && sevSet.indexOf(g.sev) < 0;
        var gm = st.msg !== null && g.msg !== st.msg;
        var gp = st.path !== null && g.path !== st.path;
        var gc = st.comp !== null && g.comp !== st.comp;
        var gf = gs + gm + gp + gc;
        if (gf > 1) return;
        if (gf === 0 || gs) add(counts.sev, g.sev, g.n);
        if (gf === 0 || gm) add(counts.msg, g.msg, g.n);
        if (gf === 0 || gp) add(counts.path, g.path, g.n);
        if (gf === 0 || gc) add(counts.comp, g.comp, g.n);
        if (gf === 0) matched += g.n;
      });
    }
    var col = COLS.filter(function (c) { return c.key === st.sort; })[0];
    if (col) {
      var keys = {};
      view.forEach(function (i) {
        var k = col.sortKey(R[i]);
        keys[i] = typeof k === 'string' ? k.toLowerCase() : k;
      });
      var dir = st.dir;
      view.sort(function (a, b) {
        var x = keys[a], y = keys[b];
        return x < y ? -dir : x > y ? dir : a - b;
      });
    }
    var pages = Math.max(1, Math.ceil(view.length / st.size));
    if (st.page > pages) st.page = pages;
  }

  // ---- rendering -------------------------------------------------------------

  function renderLead() {
    var lead = $('lead');
    lead.textContent = '';
    if (META.source) {
      lead.appendChild(el('strong', null, META.sourceUrl && /^https?:\/\//i.test(META.sourceUrl)
        ? el('a', { class: 'mono', href: META.sourceUrl, title: META.sourceUrl, target: '_blank', rel: 'noopener noreferrer' }, META.source)
        : el('span', { class: 'mono' }, META.source)));
    }
    if (typeof META.triples === 'number') {
      lead.appendChild(el('span', null, plural(META.triples, 'triple') + ' read' +
        (typeof META.triplesKept === 'number' && META.triplesKept < META.triples ? ', ' + fmt(META.triplesKept) + ' relevant to the shapes' : '')));
    }
    lead.appendChild(el('span', null, plural(TOTAL, 'validation result')));
    // "Conforms" only when something was actually checked
    if (META.conforms === true && META.targeted !== false && !(META.schemaOrgHttp > 0 && !META.schemaRewritten)) lead.appendChild(el('span', { class: 'badge yes' }, 'Conforms'));
    if (META.shapesGraphWellFormed === false) lead.appendChild(el('span', { class: 'badge no' }, 'Shapes graph not well-formed'));

    var notices = $('notices');
    notices.textContent = '';
    var notice = function (cls, title, text) {
      notices.appendChild(el('p', { class: 'notice' + (cls ? ' ' + cls : ''), role: cls ? null : 'alert' }, [el('strong', null, title), ' ' + text]));
    };
    if (META.schemaOrgHttp > 0 && !META.schemaRewritten) {
      notice('', 'Legacy schema.org namespace.', plural(META.schemaOrgHttp, 'statement') +
        ' in the data use' + (META.schemaOrgHttp === 1 ? 's' : '') + ' http://schema.org/. The shapes only match https://schema.org/, so ' +
        (META.schemaOrgHttp === 1 ? 'this statement was' : 'these statements were') + ' not checked. Run again with --schema-https to validate with the namespace rewritten.');
    }
    if (META.schemaRewritten) {
      notice('neutral', 'Namespace rewritten.', plural(META.schemaOrgHttp, 'statement') +
        ' used http://schema.org/ and ' + (META.schemaOrgHttp === 1 ? 'was' : 'were') + ' rewritten to https://schema.org/ before validation. The source itself still uses the legacy namespace.');
    }
    if (META.truncated) {
      notice('neutral', 'List shortened.', 'This report has ' + plural(TOTAL, 'result') + '. The table lists ' + fmt(R.length) +
        ' of them' + (META.maxPerError ? ', at most ' + fmt(META.maxPerError) + ' per distinct error' : '') +
        '. All counts are exact; search, sorting and the CSV download cover the listed results only. Run with --max-per-error 0 to list everything.');
    }
    if (META.targeted === false) {

    }

    var when = META.generated ? new Date(META.generated) : null;

      (META.engine ? ' (' + META.engine + ')' : '') + '. ' +
      (META.shapes ? 'Shapes: ' + META.shapes.source + ', fetched ' + new Date(META.shapes.fetched).toLocaleString() +

    foot.appendChild(el('a', { href: 'https://github.com/netwerk-digitaal-erfgoed/schema-profile/blob/main/shacl.ttl', target: '_blank', rel: 'noopener noreferrer' },
      'SCHEMA-AP-NDE SHACL'));
    foot.appendChild(document.createTextNode(' and '));
    foot.appendChild(el('a', { href: 'https://docs.nde.nl/schema-profile/', target: '_blank', rel: 'noopener noreferrer' },
      'SCHEMA-AP-NDE specification'));
    foot.appendChild(document.createTextNode('.'));
  }

  function renderLangs() {
    var box = $('langs');

    box.textContent = '';

        type: 'button', 'aria-current': l === st.lang ? 'true' : null, title: 'Show messages in ' + l,

      }, l));
    });
  }

  function renderSeverities() {
    var box = $('sev');
    box.textContent = '';
    DICT.severity.map(function (s, i) { return i; })
      .sort(function (a, b) { return sevRank(a) - sevRank(b) || a - b; })
      .forEach(function (i) {
        var on = st.sev.indexOf(i) >= 0;

  function renderFacets() {
    FACETS.forEach(function (f) {
      var select = $(f.select);
      var c = counts[f.key];
      var ids = Object.keys(c).map(Number);
      if (st[f.key] !== null && ids.indexOf(st[f.key]) < 0) ids.push(st[f.key]);
      ids.sort(function (a, b) { return (c[b] || 0) - (c[a] || 0) || a - b; });
      select.textContent = '';

  var summary = null; // distinct errors over the whole report, built once per language

  function renderSummary() {

    var body = $('summary').tBodies[0];
    body.textContent = '';
    summary.forEach(function (g) {
      var active = st.sev.length === 1 && st.sev[0] === g.sev && st.msg === g.msg && st.path === g.path && st.comp === g.comp;
      var pick = function () {

        onclick: function (e) { if (!e.target.closest('a')) pick(); },

      }, [

        el('td', { class: 'msg' }, msgNode(g.msg)),
        el('td', null, pathNode(g.path)),
        el('td', null, compNode(g.comp)),

        el('td', { class: 'num' }, fmt(g.nf))

    });
  }

  function kv(label, node) { return el('div', { class: 'kv' }, [el('span', null, label), el('span', null, node)]); }

  function detailItem(r) {
    var box = el('div', { class: 'detail-item' }, [
      el('div', { class: 'kv' }, [sevBadge(r[S]), msgNode(r[M])]),
      r[F] != null ? kv('Focus node', termNode(r[F])) : null,
      r[P] >= 0 ? kv('Path', pathNode(r[P])) : null,
      r[V] != null ? kv('Value', termNode(r[V])) : null,
      r[C] >= 0 ? kv('Constraint', compNode(r[C])) : null,
      r[H] >= 0 ? kv('Shape', shapeNode(r[H])) : null,
      r[SC] ? kv('Source constraint', termNode(r[SC])) : null

  }

  function detailRow(r) {
    var cell = el('td', { colspan: COLS.length });
    if (r[SC]) cell.appendChild(kv('Source constraint', termNode(r[SC])));
    if (r[DET] && r[DET].length) {

      r[DET].forEach(function (d) { cell.appendChild(detailItem(d)); });

  function renderHead() {
    var row = $('results').tHead.rows[0];
    row.textContent = '';
    COLS.forEach(function (c) {
      var sorted = st.sort === c.key;
      row.appendChild(el('th', { scope: 'col', 'aria-sort': sorted ? (st.dir > 0 ? 'ascending' : 'descending') : null },
        el('button', {

            update();
          }
        }, c.title)));
    });
  }

  function renderRows() {
    var body = $('results').tBodies[0];
    body.textContent = '';
    var pages = Math.max(1, Math.ceil(view.length / st.size));
    var start = (st.page - 1) * st.size;
    var end = Math.min(view.length, start + st.size);
    var frag = document.createDocumentFragment();
    for (var n = start; n < end; n++) {
      (function (i) {
        var r = R[i];

        var tr = el('tr');
        COLS.forEach(function (c, ci) {
          var td = el('td', { class: c.cls });

              type: 'button', class: 'toggle', 'aria-expanded': expanded[i] ? 'true' : 'false', 'aria-label': 'Show details',

          tr.appendChild(td);

    $('empty').hidden = !!view.length;
    $('empty').textContent = TOTAL ? 'No results match these filters.' : 'This report contains no validation results.';
    var countText = matched === TOTAL ? plural(TOTAL, 'result') : fmt(matched) + ' of ' + plural(TOTAL, 'result');
    if (view.length < matched) countText += ', ' + fmt(view.length) + ' listed';
    if (META.truncated && st.q.trim()) countText += ' (search covers the listed results only)';

    $('pager').hidden = view.length <= SIZES[0];
    $('pageinfo').textContent = view.length
      ? fmt(start + 1) + ' to ' + fmt(end) + ' of ' + fmt(view.length) + ' (page ' + fmt(st.page) + ' of ' + fmt(pages) + ')'

    $('next').disabled = st.page >= pages;
    $('size').value = String(st.size);
    $('csv').disabled = !view.length;
  }

  function update() {
    compute();
    renderLangs();
    renderSeverities();
    renderSummary();
    renderFacets();
    renderHead();
    renderRows();
    writeHash();
  }

  // ---- downloads -------------------------------------------------------------

  function download(name, type, text) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function baseName() { return (META.source || 'shacl-report').replace(/\.(ttl|nt|trig|n3)$/i, ''); }

  function csvCell(v) {
    v = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; // keep spreadsheets from reading a value as a formula
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function toCsv() {
    var lines = [['severity', 'focusNode', 'resultPath', 'value', 'message', 'sourceConstraintComponent', 'sourceShape']];
    view.forEach(function (i) {
      var r = R[i];
      lines.push([
        DICT.severity[r[S]].iri, termText(r[F]),
        r[P] < 0 ? '' : (DICT.path[r[P]].iri || DICT.path[r[P]].label), termText(r[V]), msgText(r[M]),
        r[C] < 0 ? '' : (DICT.component[r[C]].iri || DICT.component[r[C]].label),
        r[H] < 0 ? '' : DICT.shape[r[H]].id
      ]);
    });
    return String.fromCharCode(0xFEFF) + lines.map(function (l) { return l.map(csvCell).join(','); }).join('\r\n') + '\r\n';
  }

  // ---- wiring ------------------------------------------------------------------

  FACETS.forEach(function (f) {
    $(f.select).addEventListener('change', function (e) {
      st[f.key] = e.target.value === '' ? null : parseInt(e.target.value, 10);
      st.page = 1;
      update();
    });
  });
  var timer = null;
  $('f-q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var value = e.target.value;
    timer = setTimeout(function () { st.q = value; st.page = 1; update(); }, 150);
  });
  $('reset').addEventListener('click', function () {
    st.sev = []; st.msg = st.path = st.comp = null; st.q = ''; st.page = 1;
    $('f-q').value = '';
    update();
  });
  $('prev').addEventListener('click', function () { st.page--; update(); $('results-card').scrollIntoView({ block: 'start' }); });
  $('next').addEventListener('click', function () { st.page++; update(); $('results-card').scrollIntoView({ block: 'start' }); });
  $('size').addEventListener('change', function (e) { st.size = parseInt(e.target.value, 10); st.page = 1; update(); });
  $('csv').addEventListener('click', function () { download(baseName() + '.csv', 'text/csv;charset=utf-8', toCsv()); });
  $('json').addEventListener('click', function () { download(baseName() + '.json', 'application/json', JSON.stringify(D, null, 1)); });
  window.addEventListener('hashchange', function () {
    if (location.hash.replace(/^#/, '') === hashString()) return;
    readHash();
    summary = null;
    update();
  });

  // ---- theme ---------------------------------------------------------------------

  var root = document.documentElement;
  var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  function storedTheme() { try { return localStorage.getItem('schema-ap-nde-shacl-theme'); } catch (e) { return null; } }
  function setTheme(dark) {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
    $('theme').setAttribute('aria-pressed', dark ? 'true' : 'false');
    $('theme').setAttribute('aria-label', label);
    $('theme').title = label;
  }
  $('theme').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') !== 'dark';
    setTheme(dark);
    try { localStorage.setItem('schema-ap-nde-shacl-theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
  // Without a stored choice the page keeps following the system setting.
  systemDark.addEventListener('change', function (e) { if (!storedTheme()) setTheme(e.matches); });
  // Always print on white.
  var beforePrint = null;
  window.addEventListener('beforeprint', function () { beforePrint = root.getAttribute('data-theme'); root.setAttribute('data-theme', 'light'); });
  window.addEventListener('afterprint', function () { if (beforePrint) root.setAttribute('data-theme', beforePrint); });
  setTheme(root.getAttribute('data-theme') === 'dark');

  readHash();
  renderLead();
  update();
})();
</script>
</body>
</html>
